name: factory_check_app
description: "Factory floor calls, operator coordination and downtime tracking."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.2.3+6

environment:
  sdk: ^3.10.4


dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  shared_preferences: ^2.2.3

  cupertino_icons: ^1.0.8
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5
  image_picker: ^1.2.1
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0

flutter:
  generate: true

  uses-material-design: true
  assets:
    - asset/factory_kroki.png
